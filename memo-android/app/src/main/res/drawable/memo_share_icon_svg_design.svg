    <path d="M525 692L665 835" stroke="url(#share)" stroke-width="28" stroke-linecap="round"/>

    <circle cx="505" cy="680" r="43" fill="url(#share)"/>
    <circle cx="800" cy="565" r="68" fill="url(#share)"/>
