<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="140" y1="120" x2="860" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE96B"/>
      <stop offset="1" stop-color="#FFC907"/>
    </linearGradient>

    <linearGradient id="line" x1="180" y1="260" x2="650" y2="260" gradientUnits="userSpaceOnUse">
