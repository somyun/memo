<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메모</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #ede8dd;
      --card:        #fef9c3;
      --card-hover:  #fefacc;
      --card-shadow: 2px 4px 10px rgba(0,0,0,0.11), 0 1px 2px rgba(0,0,0,0.07);
      --card-border: rgba(0,0,0,0.07);
      --text:        #2b2b2b;
      --muted:       #aaa;
      --danger:      #cc2200;
      --font:        '맑은 고딕', 'Malgun Gothic', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      padding: 28px 24px 48px;
    }

    /* subtle paper texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 31px,
          rgba(0,0,0,0.025) 31px,
          rgba(0,0,0,0.025) 32px
        );
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      height: 24px;
    }

    h1 {
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #status {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
      min-height: 14px;
      transition: opacity 0.3s;
    }

    /* ── Grid ── */
    .grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
      align-items: start;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      padding: 10px 12px 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: box-shadow 0.15s, transform 0.15s;
      animation: cardIn 0.18s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card:focus-within {
      box-shadow: 3px 6px 18px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.09);
    }

    /* tape strip at top */
    .card::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 12px;
      background: rgba(255,255,200,0.7);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 1px;
    }

    .card--empty {
      border-style: dashed;
      box-shadow: none;
      opacity: 0.55;
    }

    .card--empty::before { display: none; }

    .card--empty:focus-within {
      border-style: solid;
      box-shadow: var(--card-shadow);
      opacity: 1;
    }

    /* ── Textarea ── */
    .card-text {
      width: 100%;
      min-height: 260px;
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.68;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      padding: 0;
      overflow: hidden;
    }

    .card-text::placeholder { color: #bbb; }

    .card-text-shell:not(.is-editing) .card-text {
      display: none;
    }

    .card-text-shell.is-editing .card-text-preview {
      display: none;
    }

    .card-text-preview {
      width: 100%;
      min-height: 260px;
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.68;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      cursor: text;
    }

    .card-text-preview .memo-link {
      color: #3366aa;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .card-text-preview .memo-placeholder {
      color: #bbb;
    }

    /* ── Delete button ── */
    .delete-btn {
      position: absolute;
      top: 6px;
      right: 7px;
      background: none;
      border: none;
      font-size: 15px;
      color: #ccc;
      cursor: pointer;
      line-height: 1;
      padding: 1px 4px;
      opacity: 0;
      transition: opacity 0.12s, color 0.12s;
      z-index: 2;
    }

    .card:hover .delete-btn,
    .card:focus-within .delete-btn { opacity: 1; }
    .delete-btn:hover { color: var(--danger); }

    /* ── Images ── */
    .card-images { display: flex; flex-direction: column; gap: 6px; }

    .img-wrap {
      position: relative;
      overflow: hidden;
    }

    .img-wrap img {
      width: 100%;
      display: block;
      cursor: zoom-in;
      transition: opacity 0.2s;
    }

    .img-wrap img:hover { opacity: 0.9; }

    .remove-img {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(0,0,0,0.52);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.12s;
    }

    .img-wrap:hover .remove-img { opacity: 1; }

    /* uploading placeholder */
    .upload-placeholder {
      width: 100%;
      height: 60px;
      background: rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
      border: 1px dashed #ccc;
    }

    .card-date {
      font-size: 10px;
      color: var(--muted);
      text-align: right;
      margin-top: auto;
    }

    /* ── File attachments ── */
    .card-files {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-link {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      padding: 4px 6px;
      background: rgba(0,0,0,0.04);
      border-radius: 3px;
      transition: background 0.12s;
    }

    .file-link:hover {
      background: rgba(0,0,0,0.08);
    }

    .file-link a {
      color: #3366aa;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .file-link a:hover {
      text-decoration: underline;
    }

    .file-link .file-icon {
      font-size: 13px;
      flex-shrink: 0;
    }

    .remove-file {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
      transition: color 0.12s;
    }

    .remove-file:hover {
      color: var(--danger);
    }

    .zip-area {
      display: flex;
      justify-content: flex-start;
    }

    .zip-download-btn {
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 3px;
      background: rgba(255,255,255,0.45);
      color: #4d421f;
      cursor: pointer;
      font-size: 12px;
      padding: 4px 7px;
      transition: background 0.12s;
    }

    .zip-download-btn:hover {
      background: rgba(0,0,0,0.07);
    }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      z-index: 100;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    #lightbox.open { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <h1>memo</h1>
  <div id="status"></div>
</header>

<div class="grid" id="grid"></div>

<div id="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  /* ═══════════════════════════════════════
     설정
  ═══════════════════════════════════════ */
  const GITHUB_OWNER = "somyun";
  const GITHUB_REPO  = "memo";
  const GITHUB_BRANCH = "main";

  firebase.initializeApp({
    apiKey: "AIzaSyBdJN2qn4Gox8jpIm8ZfPxzeoIU0G_eA-o",
    authDomain: "memo-3a7c8.firebaseapp.com",
    projectId: "memo-3a7c8",
    storageBucket: "memo-3a7c8.firebasestorage.app",
    messagingSenderId: "674466200117",
    appId: "1:674466200117:web:02cb1572cd0a2597ffcf7c"
  });
  const db = firebase.firestore();
  /* ═══════════════════════════════════════ */

  let GITHUB_TOKEN = null;
  let memos = [];
  let saveTimer = null;
  let localSaveInProgress = false;
  let isFirstSnapshot = true;

  /* ── Utilities ── */
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const setStatus = msg => document.getElementById("status").textContent = msg;

  function formatDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function normalizeLinkHref(url) {
    return /^https?:\/\//i.test(url) ? url : `https://${url}`;
  }

  function trimUrlPunctuation(url) {
    return url.replace(/[.,!?;:\)\]\}]+$/g, "");
  }

  function splitMemoLinks(text) {
    const value = String(text || "");
    const regex = /(?:https?:\/\/|www\.)[^\s<>"']+/gi;
    const parts = [];
    let cursor = 0;

    for (const match of value.matchAll(regex)) {
      const raw = match[0];
      const linkedText = trimUrlPunctuation(raw);
      if (!linkedText) continue;

      const start = match.index;
      const end = start + linkedText.length;
      if (start > cursor) {
        parts.push({ text: value.slice(cursor, start) });
      }
      parts.push({ text: linkedText, href: normalizeLinkHref(linkedText) });
      cursor = end;
    }

    if (cursor < value.length) {
      parts.push({ text: value.slice(cursor) });
    }
    return parts;
  }

  function updateLinkedText(container, text, placeholder = "") {
    const value = String(text || "");
    container.replaceChildren();

    if (!value && placeholder) {
      const span = document.createElement("span");
      span.className = "memo-placeholder";
      span.textContent = placeholder;
      container.appendChild(span);
      return;
    }

    splitMemoLinks(value).forEach(part => {
      if (part.href) {
        const link = document.createElement("a");
        link.className = "memo-link";
        link.href = part.href;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = part.text;
        container.appendChild(link);
      } else {
        container.appendChild(document.createTextNode(part.text));
      }
    });
  }

  function newMemoObj(text = '', images = [], files = []) {
    return { id: uid(), text, images, files, pinned: false, created: Date.now(), updated: Date.now() };
  }

  function fileNameFromUrl(url, fallback = "attachment") {
    const clean = String(url || "").split(/[?#]/)[0];
    const last = clean.slice(clean.lastIndexOf("/") + 1);
    try {
      return decodeURIComponent(last) || fallback;
    } catch {
      return last || fallback;
    }
  }

  function safeZipName(name, fallback = "attachment") {
    return String(name || fallback)
      .replace(/[\\/:*?"<>|\x00-\x1f]/g, "_")
      .replace(/^\.+$/, fallback)
      .slice(0, 160) || fallback;
  }

  function memoAttachments(memo) {
    return [
      ...(memo.images || []).map((url, index) => ({
        name: fileNameFromUrl(url, `image-${index + 1}.jpg`),
        url
      })),
      ...(memo.files || []).map((file, index) => ({
        name: file.name || fileNameFromUrl(file.url, `file-${index + 1}`),
        url: file.url
      }))
    ].filter(item => item.url);
  }

  function triggerDownload(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  let crcTable = null;

  function getCrcTable() {
    if (crcTable) return crcTable;
    crcTable = new Uint32Array(256);
    for (let n = 0; n < 256; n += 1) {
      let c = n;
      for (let k = 0; k < 8; k += 1) {
        c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      }
      crcTable[n] = c >>> 0;
    }
    return crcTable;
  }

  function crc32(bytes) {
    const table = getCrcTable();
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i += 1) {
      c = table[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    }
    return (c ^ 0xffffffff) >>> 0;
  }

  function dosDateTime(date = new Date()) {
    const year = Math.max(1980, date.getFullYear());
    const time = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
    const dosDate = ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | (date.getDate() || 1);
    return { time, date: dosDate };
  }

  function makeZip(files) {
    const encoder = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    const usedNames = new Map();
    let offset = 0;

    files.forEach((file, index) => {
      const baseName = safeZipName(file.name, `attachment-${index + 1}`);
      const seen = usedNames.get(baseName) || 0;
      usedNames.set(baseName, seen + 1);
      const name = seen ? baseName.replace(/(\.[^.]*)?$/, `-${seen + 1}$1`) : baseName;
      const nameBytes = encoder.encode(name);
      const data = file.data;
      const crc = crc32(data);
      const stamp = dosDateTime();

      const local = new Uint8Array(30 + nameBytes.length);
      const localView = new DataView(local.buffer);
      localView.setUint32(0, 0x04034b50, true);
      localView.setUint16(4, 20, true);
      localView.setUint16(6, 0x0800, true);
      localView.setUint16(8, 0, true);
      localView.setUint16(10, stamp.time, true);
      localView.setUint16(12, stamp.date, true);
      localView.setUint32(14, crc, true);
      localView.setUint32(18, data.length, true);
      localView.setUint32(22, data.length, true);
      localView.setUint16(26, nameBytes.length, true);
      local.set(nameBytes, 30);

      const central = new Uint8Array(46 + nameBytes.length);
      const centralView = new DataView(central.buffer);
      centralView.setUint32(0, 0x02014b50, true);
      centralView.setUint16(4, 20, true);
      centralView.setUint16(6, 20, true);
      centralView.setUint16(8, 0x0800, true);
      centralView.setUint16(10, 0, true);
      centralView.setUint16(12, stamp.time, true);
      centralView.setUint16(14, stamp.date, true);
      centralView.setUint32(16, crc, true);
      centralView.setUint32(20, data.length, true);
      centralView.setUint32(24, data.length, true);
      centralView.setUint16(28, nameBytes.length, true);
      centralView.setUint32(42, offset, true);
      central.set(nameBytes, 46);

      localParts.push(local, data);
      centralParts.push(central);
      offset += local.length + data.length;
    });

    const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
    const end = new Uint8Array(22);
    const endView = new DataView(end.buffer);
    endView.setUint32(0, 0x06054b50, true);
    endView.setUint16(8, files.length, true);
    endView.setUint16(10, files.length, true);
    endView.setUint32(12, centralSize, true);
    endView.setUint32(16, offset, true);

    return new Blob([...localParts, ...centralParts, end], { type: "application/zip" });
  }

  async function downloadAttachmentsZip(attachments, zipName) {
    if (attachments.length < 2) return;
    setStatus("첨부 압축 중...");

    try {
      const files = [];
      for (let i = 0; i < attachments.length; i += 1) {
        const attachment = attachments[i];
        setStatus(`첨부 다운로드 중... ${i + 1}/${attachments.length}`);
        const response = await fetch(attachment.url);
        if (!response.ok) throw new Error(`${attachment.name} 다운로드 실패 (${response.status})`);
        files.push({
          name: attachment.name,
          data: new Uint8Array(await response.arrayBuffer())
        });
      }

      triggerDownload(makeZip(files), zipName);
      setStatus("압축파일 생성됨");
      setTimeout(() => setStatus(""), 1600);
    } catch (err) {
      console.error(err);
      setStatus("압축 다운로드 실패: " + err.message);
    }
  }

  /* ── Load (Firestore 실시간 리스너) ── */
  window.onload = () => {
    setStatus("불러오는 중...");
    db.collection("memos").onSnapshot((snapshot) => {
      memos = snapshot.docs.map(doc => {
        const data = doc.data();
        if (!Array.isArray(data.images)) data.images = [];
        if (!Array.isArray(data.files)) data.files = [];
        if (typeof data.pinned !== "boolean") data.pinned = false;
        return { ...data, id: doc.id };
      });

      if (isFirstSnapshot) {
        isFirstSnapshot = false;
        renderAll();
        setStatus("");
        return;
      }

      // 로컬 저장 직후의 onSnapshot 콜백은 무시 (깜빡임 방지)
      if (!localSaveInProgress) {
        renderAll();
      }
    }, (error) => {
      setStatus("연결 실패: " + error.message);
      renderAll();
    });
  };

  /* ── Save (개별 메모 단위, debounced) ── */
  function scheduleSave(memo) {
    clearTimeout(saveTimer);
    setStatus("저장 중...");
    saveTimer = setTimeout(() => persistMemo(memo), 1400);
  }

  async function persistMemo(memo) {
    localSaveInProgress = true;
    try {
      await db.collection("memos").doc(memo.id).set(memo);
      setStatus("저장됨");
      setTimeout(() => setStatus(""), 2200);
    } catch (err) {
      setStatus("저장 실패: " + err.message);
    }
    setTimeout(() => { localSaveInProgress = false; }, 500);
  }

  async function deleteMemo(memoId) {
    localSaveInProgress = true;
    try {
      await db.collection("memos").doc(memoId).delete();
    } catch (err) {
      console.error("Firestore 메모 삭제 실패:", err);
    }
    setTimeout(() => { localSaveInProgress = false; }, 500);
  }

  /* ── Render ── */
  function renderAll() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    memos.forEach(m => grid.appendChild(buildCard(m)));
    grid.appendChild(buildEmptyCard());
  }

  /* Existing memo card */
  function buildCard(memo) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = memo.id;

    // delete button
    const del = document.createElement("button");
    del.className = "delete-btn";
    del.textContent = "×";
    del.title = "삭제";
    del.onclick = () => {
      if (!confirm("이 메모를 삭제할까요?")) return;
      memos = memos.filter(m => m.id !== memo.id);
      card.remove();
      deleteMemo(memo.id);
    };

    const dateDiv = document.createElement("div");
    dateDiv.className = "card-date";
    dateDiv.textContent = formatDate(memo.updated);

    // memo text
    const textShell = buildTextEditor(memo.text);
    const ta = textShell.textarea;
    ta.oninput = () => {
      memo.text = ta.value;
      memo.updated = Date.now();
      dateDiv.textContent = formatDate(memo.updated);
      autoGrow(ta);
      textShell.updatePreview();
      scheduleSave(memo);
    };
    ta.addEventListener("paste", e => handlePaste(e, memo, card, ta));

    // images
    const imgArea = document.createElement("div");
    imgArea.className = "card-images";
    memo.images.forEach(url => imgArea.appendChild(buildImgWrap(url, memo)));

    // files
    const fileArea = document.createElement("div");
    fileArea.className = "card-files";
    memo.files.forEach(f => fileArea.appendChild(buildFileLink(f, memo)));

    const zipArea = document.createElement("div");
    zipArea.className = "zip-area";
    syncZipButton(card, memo, zipArea);

    card.appendChild(del);
    card.appendChild(textShell);
    card.appendChild(imgArea);
    card.appendChild(fileArea);
    card.appendChild(zipArea);
    card.appendChild(dateDiv);

    // grow on next tick (after mount)
    requestAnimationFrame(() => autoGrow(ta));
    return card;
  }

  /* Blank new-memo card */
  function buildEmptyCard() {
    const card = document.createElement("div");
    card.className = "card card--empty";
    card.dataset.id = "";

    const textShell = buildTextEditor("", {
      startEditing: true,
      focusOnStart: false,
      placeholder: "새 메모..."
    });
    const ta = textShell.textarea;
    ta.placeholder = "새 메모...";

    const imgArea = document.createElement("div");
    imgArea.className = "card-images";

    const fileArea = document.createElement("div");
    fileArea.className = "card-files";

    const zipArea = document.createElement("div");
    zipArea.className = "zip-area";

    // Promote to real card on first input
    const promote = (force = false) => {
      if (!force && !ta.value.trim() && card.querySelector(".card-images").children.length === 0
          && card.querySelector(".card-files").children.length === 0) return;
      const memo = newMemoObj(ta.value);
      memos.push(memo);

      card.className = "card";
      card.dataset.id = memo.id;

      const del = document.createElement("button");
      del.className = "delete-btn";
      del.textContent = "×";
      del.title = "삭제";
      del.onclick = () => {
        if (!confirm("이 메모를 삭제할까요?")) return;
        memos = memos.filter(m => m.id !== memo.id);
        card.remove();
        deleteMemo(memo.id);
      };

      const dateDiv = document.createElement("div");
      dateDiv.className = "card-date";
      dateDiv.textContent = formatDate(memo.updated);

      card.insertBefore(del, textShell);
      card.appendChild(dateDiv);

      // replace input handler
      ta.oninput = () => {
        memo.text = ta.value;
        memo.updated = Date.now();
        dateDiv.textContent = formatDate(memo.updated);
        autoGrow(ta);
        textShell.updatePreview();
        scheduleSave(memo);
      };
      ta.removeEventListener("input", onEmptyInput);
      ta.addEventListener("paste", e => handlePaste(e, memo, card, ta));

      // swap paste handler
      imgArea.dataset.memoId = memo.id;

      document.getElementById("grid").appendChild(buildEmptyCard());
      scheduleSave(memo);
      return memo;
    };

    const onEmptyInput = () => { promote(); };
    ta.addEventListener("input", onEmptyInput);
    ta.addEventListener("paste", e => {
      // if file/image is pasted into empty card, promote first
      const items = e.clipboardData?.items || [];
      for (const item of items) {
        if (item.kind === "file") {
          e.preventDefault();
          const file = item.getAsFile();
          if (!file) return;
          const memo = promote(true);
          if (item.type.startsWith("image/")) {
            uploadImage(file, memo, card);
          } else {
            uploadFile(file, memo, card);
          }
          return;
        }
      }
    });

    card.appendChild(textShell);
    card.appendChild(imgArea);
    card.appendChild(fileArea);
    card.appendChild(zipArea);
    return card;
  }

  /* Shared textarea builder */
  function buildTextarea(value) {
    const ta = document.createElement("textarea");
    ta.className = "card-text";
    ta.value = value;
    ta.rows = 1;
    ta.oninput = () => autoGrow(ta);
    return ta;
  }

  function buildTextEditor(value, options = {}) {
    const shell = document.createElement("div");
    shell.className = "card-text-shell";

    const preview = document.createElement("div");
    preview.className = "card-text-preview";
    preview.tabIndex = 0;

    const ta = buildTextarea(value);
    const placeholder = options.placeholder || "";

    const setEditing = (editing, shouldFocus = true) => {
      shell.classList.toggle("is-editing", editing);
      if (editing) {
        requestAnimationFrame(() => {
          if (shouldFocus) ta.focus();
          autoGrow(ta);
        });
      } else {
        updateLinkedText(preview, ta.value, placeholder || ta.placeholder);
      }
    };

    shell.textarea = ta;
    shell.updatePreview = () => updateLinkedText(preview, ta.value, placeholder || ta.placeholder);

    preview.addEventListener("click", (event) => {
      if (event.target.closest("a")) return;
      setEditing(true);
    });
    preview.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === "F2") {
        event.preventDefault();
        setEditing(true);
      }
    });
    ta.addEventListener("blur", () => setEditing(false));

    shell.appendChild(preview);
    shell.appendChild(ta);
    shell.updatePreview();
    setEditing(options.startEditing === true, options.focusOnStart !== false);
    return shell;
  }

  /* Auto-grow textarea */
  function autoGrow(ta) {
    ta.style.height = "auto";
    const min = 260; // ~10 lines
    ta.style.height = Math.max(min, ta.scrollHeight) + "px";
  }

  /* Image wrap element */
  function buildImgWrap(url, memo) {
    const wrap = document.createElement("div");
    wrap.className = "img-wrap";

    const img = document.createElement("img");
    img.src = url;
    img.loading = "lazy";
    img.alt = "첨부 이미지";
    img.onclick = () => openLightbox(url);

    const rmBtn = document.createElement("button");
    rmBtn.className = "remove-img";
    rmBtn.textContent = "×";
    rmBtn.title = "이미지 제거";
    rmBtn.onclick = async () => {
      if (!confirm("이 이미지를 삭제할까요?\nGitHub에 업로드된 파일도 함께 삭제됩니다.")) return;
      memo.images = memo.images.filter(u => u !== url);
      const card = wrap.closest(".card");
      wrap.remove();
      if (card) syncZipButton(card, memo);
      scheduleSave(memo);
      // GitHub 원본 삭제 (백그라운드)
      deleteGithubFile(url).catch(err => console.warn("GitHub 이미지 삭제 실패:", err));
    };

    wrap.appendChild(img);
    wrap.appendChild(rmBtn);
    return wrap;
  }

  /* File link element */
  function buildFileLink(fileObj, memo) {
    const wrap = document.createElement("div");
    wrap.className = "file-link";

    const icon = document.createElement("span");
    icon.className = "file-icon";
    icon.textContent = "📎";

    const link = document.createElement("a");
    link.href = fileObj.url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = fileObj.name;
    link.title = fileObj.name;

    const rmBtn = document.createElement("button");
    rmBtn.className = "remove-file";
    rmBtn.textContent = "×";
    rmBtn.title = "파일 제거";
    rmBtn.onclick = async () => {
      if (!confirm(`"${fileObj.name}" 첨부를 삭제할까요?\nGitHub에 업로드된 파일도 함께 삭제됩니다.`)) return;
      memo.files = memo.files.filter(f => f.url !== fileObj.url);
      const card = wrap.closest(".card");
      wrap.remove();
      if (card) syncZipButton(card, memo);
      scheduleSave(memo);
      // GitHub 원본 삭제 (백그라운드)
      deleteGithubFile(fileObj.url).catch(err => console.warn("GitHub 파일 삭제 실패:", err));
    };

    wrap.appendChild(icon);
    wrap.appendChild(link);
    wrap.appendChild(rmBtn);
    return wrap;
  }

  function syncZipButton(card, memo, zipArea = null) {
    const area = zipArea || card.querySelector(".zip-area");
    if (!area) return;

    area.replaceChildren();
    const attachments = memoAttachments(memo);
    if (attachments.length < 2) return;

    const btn = document.createElement("button");
    btn.className = "zip-download-btn";
    btn.type = "button";
    btn.textContent = "전체 다운로드";
    btn.title = "첨부 전체 압축 다운로드";
    btn.onclick = () => downloadAttachmentsZip(attachments, `memo-${memo.id}-attachments.zip`);
    area.appendChild(btn);
  }

  /* ── 통합 Paste handler (이미지 + 파일) ── */
  async function handlePaste(e, memo, card, ta) {
    const items = e.clipboardData?.items || [];
    for (const item of items) {
      if (item.kind === "file") {
        e.preventDefault();
        const file = item.getAsFile();
        if (!file) return;
        if (item.type.startsWith("image/")) {
          await uploadImage(file, memo, card);
        } else {
          await uploadFile(file, memo, card);
        }
        return;
      }
    }
  }

  /* ── 이미지 압축 (Canvas 리사이징) ── */
  async function compressImage(file, maxDimension = 1600, quality = 0.82) {
    // 500KB 미만이면 압축 불필요
    if (file.size < 500 * 1024) return file;

    return new Promise((resolve) => {
      const img = new Image();
      const blobUrl = URL.createObjectURL(file);

      img.onload = () => {
        URL.revokeObjectURL(blobUrl);

        let { width, height } = img;

        // maxDimension 초과 시 비율 유지하며 축소
        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height = Math.round(height * (maxDimension / width));
            width  = maxDimension;
          } else {
            width  = Math.round(width * (maxDimension / height));
            height = maxDimension;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width  = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);

        canvas.toBlob((blob) => {
          // 압축 후 오히려 더 커지면 원본 사용
          if (!blob || blob.size >= file.size) { resolve(file); return; }

          const newName = file.name.replace(/\.\w+$/, ".jpg");
          resolve(new File([blob], newName, { type: "image/jpeg" }));
        }, "image/jpeg", quality);
      };

      img.onerror = () => { URL.revokeObjectURL(blobUrl); resolve(file); };
      img.src = blobUrl;
    });
  }

  /* ── GitHub 이미지 업로드 ── */
  async function uploadImage(file, memo, card) {
    const imgArea = card.querySelector(".card-images");

    const ph = document.createElement("div");
    ph.className = "upload-placeholder";
    ph.textContent = "이미지 압축 중...";
    imgArea.appendChild(ph);

    try {
      // 1) 이미지 압축
      const originalSize = file.size;
      const compressed = await compressImage(file);
      const savedPct = Math.round((1 - compressed.size / originalSize) * 100);
      console.log(`[이미지 압축] ${(originalSize/1024).toFixed(0)}KB → ${(compressed.size/1024).toFixed(0)}KB (${savedPct}% 절감)`);

      ph.textContent = "이미지 업로드 중...";

      // 2) base64 변환
      const token = await loadGithubToken();
      const base64 = await fileToBase64(compressed);
      const pureBase64 = base64.split(",")[1];

      // 3) 파일 이름 결정 (압축 시 항상 jpg)
      const ext = (compressed.type.split("/")[1] || "png").replace("jpeg", "jpg");
      const fileName = `uploads/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;

      // 4) GitHub 업로드
      const res = await fetch(
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${fileName}`,
        {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Upload image ${fileName}`,
            content: pureBase64,
            branch: GITHUB_BRANCH
          })
        }
      );

      if (!res.ok) {
        const err = await res.text();
        throw new Error(err);
      }

      const imageUrl = `https://cdn.jsdelivr.net/gh/${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/${fileName}`;

      memo.images.push(imageUrl);
      memo.updated = Date.now();

      const dateDiv = card.querySelector(".card-date");
      if (dateDiv) dateDiv.textContent = formatDate(memo.updated);

      const imgWrap = buildImgWrap(imageUrl, memo);
      // CDN 캐시 딜레이(404) 방지: 화면에는 압축된 로컬 base64를 즉시 표시
      imgWrap.querySelector("img").src = base64;
      imgWrap.querySelector("img").onclick = () => openLightbox(base64);

      ph.replaceWith(imgWrap);
      syncZipButton(card, memo);
      scheduleSave(memo);

    } catch (err) {
      console.error(err);
      ph.textContent = "업로드 실패";
      setTimeout(() => ph.remove(), 3000);
    }
  }

  /* ── 일반 파일 업로드 ── */
  async function uploadFile(file, memo, card) {
    const fileArea = card.querySelector(".card-files");

    const ph = document.createElement("div");
    ph.className = "upload-placeholder";
    ph.textContent = `"${file.name}" 업로드 중...`;
    fileArea.appendChild(ph);

    try {
      const token = await loadGithubToken();
      const base64 = await fileToBase64(file);
      const pureBase64 = base64.split(",")[1];

      const safeName = file.name.replace(/[^a-zA-Z0-9가-힣._-]/g, "_");
      const fileName = `uploads/${Date.now()}_${safeName}`;

      const res = await fetch(
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${fileName}`,
        {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Upload file ${fileName}`,
            content: pureBase64,
            branch: GITHUB_BRANCH
          })
        }
      );

      if (!res.ok) {
        const err = await res.text();
        throw new Error(err);
      }

      const fileUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${fileName}`;
      const fileObj = { name: file.name, url: fileUrl };

      memo.files.push(fileObj);
      memo.updated = Date.now();

      const dateDiv = card.querySelector(".card-date");
      if (dateDiv) dateDiv.textContent = formatDate(memo.updated);

      ph.replaceWith(buildFileLink(fileObj, memo));
      syncZipButton(card, memo);
      scheduleSave(memo);
      console.log(`[파일 업로드] ${file.name} (${(file.size/1024).toFixed(0)}KB)`);

    } catch (err) {
      console.error(err);
      ph.textContent = "업로드 실패";
      setTimeout(() => ph.remove(), 3000);
    }
  }

  /* ── GitHub 파일 삭제 ── */
  function extractGithubPath(url) {
    // jsDelivr: https://cdn.jsdelivr.net/gh/owner/repo@branch/uploads/xxx
    let match = url.match(/\/gh\/[^/]+\/[^@]+@[^/]+\/(.+)$/);
    if (match) return match[1];
    // raw.githubusercontent: https://raw.githubusercontent.com/owner/repo/branch/uploads/xxx
    match = url.match(/raw\.githubusercontent\.com\/[^/]+\/[^/]+\/[^/]+\/(.+)$/);
    return match ? match[1] : null;
  }

  async function deleteGithubFile(cdnUrl) {
    const filePath = extractGithubPath(cdnUrl);
    if (!filePath) { console.warn("GitHub 경로 추출 실패:", cdnUrl); return; }

    const token = await loadGithubToken();
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${filePath}?ref=${GITHUB_BRANCH}`;

    // 1) SHA 조회
    const infoRes = await fetch(apiUrl, {
      headers: {
        "Authorization": `token ${token}`,
        "Accept": "application/vnd.github+json"
      }
    });

    if (!infoRes.ok) throw new Error(`SHA 조회 실패 (${infoRes.status})`);
    const info = await infoRes.json();

    // 2) 삭제 요청
    const delRes = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${filePath}`,
      {
        method: "DELETE",
        headers: {
          "Authorization": `token ${token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `Delete ${filePath}`,
          sha: info.sha,
          branch: GITHUB_BRANCH
        })
      }
    );

    if (!delRes.ok) throw new Error(`삭제 실패 (${delRes.status})`);
    console.log(`[GitHub 삭제] ${filePath}`);
  }

  /* ── Lightbox ── */
  function openLightbox(url) {
    const lb = document.getElementById("lightbox");
    document.getElementById("lightbox-img").src = url;
    lb.classList.add("open");
  }

  document.getElementById("lightbox").onclick = function () {
    this.classList.remove("open");
    document.getElementById("lightbox-img").src = "";
  };

  /* ── file to base64 ── */
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);

      reader.readAsDataURL(file);
    });
  }

  /* ── GitHub 토큰 불러오기 (Firestore) ── */
  async function loadGithubToken() {
    if (GITHUB_TOKEN) return GITHUB_TOKEN;

    const docSnap = await db.collection("config").doc("github").get();
    if (!docSnap.exists) throw new Error("GitHub 토큰 설정 없음");

    const data = docSnap.data();
    if (!data.token) throw new Error("토큰 없음");

    GITHUB_TOKEN = data.token;
    return GITHUB_TOKEN;
  }
  
</script>
